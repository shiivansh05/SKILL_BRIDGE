        // Status Badge (icon + label + colour)
        function StatusTag({ type, label }) {
            const styles = {
                matched: "bg-ok-bg text-ok border-ok/20",
                verified: "bg-teal-50 text-teal border-teal/20",
                partial: "bg-warn-bg text-warn border-warn/20",
                concern: "bg-warn-bg text-warn border-warn/20",
                missing: "bg-bad-bg text-bad border-bad/20",
                aligned: "bg-ok-bg text-ok border-ok/20",
                critical: "bg-bad-bg text-bad border-bad/20",
                neutral: "bg-slate-100 text-ink-muted border-line"
            };

            const icons = {
                matched: <span className="font-bold text-xs">✓</span>,
                verified: <span className="font-bold text-xs">✓</span>,
                aligned: <span className="font-bold text-xs">✓</span>,
                partial: <span className="font-bold text-xs">⚠</span>,
                concern: <span className="font-bold text-xs">⚠</span>,
                missing: <span className="font-bold text-xs">✕</span>,
                critical: <span className="font-bold text-xs">✕</span>,
                neutral: null
            };

            const currentStyle = styles[type] || styles.neutral;
            const currentIcon = icons[type];

            return (
                <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-sm text-xs font-medium border ${currentStyle}`}>
                    {currentIcon}
                    <span>{label}</span>
                </span>
            );
        }

        // Button component
        function Button({ children, variant = 'primary', size = 'md', className = '', ...props }) {
            const base = "inline-flex items-center justify-center font-medium rounded-sm transition focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed";
            const sizes = {
                sm: "px-2.5 py-1 text-xs h-7",
                md: "px-3.5 py-1.5 text-xs h-9",
                lg: "px-4 py-2 text-sm h-10"
            };
            const variants = {
                primary: "bg-navy hover:bg-navy-hover text-white shadow-sb-sm",
                secondary: "bg-white hover:bg-slate-50 text-navy border border-line-strong shadow-sb-sm",
                tertiary: "bg-transparent text-brand hover:text-brand-hover hover:underline p-0 h-auto",
                danger: "bg-bad hover:bg-bad/90 text-white shadow-sb-sm"
            };
            return (
                <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...props}>
                    {children}
                </button>
            );
        }

        // Accessible Form Field
        function Field({ label, id, error, children, required, hint }) {
            return (
                <div className="space-y-1 text-left">
                    {label && (
                        <label htmlFor={id} className="block text-xs font-semibold text-ink">
                            {label} {required && <span className="text-bad" aria-hidden="true">*</span>}
                        </label>
                    )}
                    {children}
                    {hint && !error && <p className="text-[11px] text-ink-muted">{hint}</p>}
                    {error && (
                        <p id={`${id}-error`} className="text-[11px] text-bad flex items-center gap-1 font-medium" role="alert">
                            <Icons.Cross /> {error}
                        </p>
                    )}
                </div>
            );
        }

        // Reusable Modal Component
        function Modal({ isOpen, onClose, title, children, maxWidth = "max-w-lg" }) {
            const modalRef = useRef(null);

            useEffect(() => {
                if (!isOpen) return;
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') onClose();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isOpen, onClose]);

            if (!isOpen) return null;

            return (
                <div 
                    className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy/45 backdrop-blur-[2px] fade-in" 
                    role="dialog" 
                    aria-modal="true" 
                    aria-labelledby="modal-title"
                >
                    <div className="fixed inset-0" onClick={onClose}></div>
                    <div 
                        ref={modalRef} 
                        className={`relative bg-surface rounded-lg border border-line shadow-sb-md w-full ${maxWidth} p-6 max-h-[90vh] overflow-y-auto z-10`}
                    >
                        <div className="flex items-center justify-between border-b border-line pb-3 mb-4">
                            <h3 id="modal-title" className="text-base font-semibold text-navy">{title}</h3>
                            <button 
                                onClick={onClose} 
                                className="p-1 rounded-sm text-ink-muted hover:text-navy hover:bg-slate-100 transition"
                                aria-label="Close modal"
                            >
                                <Icons.Close />
                            </button>
                        </div>
                        {children}
                    </div>
                </div>
            );
        }

        function calculateMatchScore(candidateSkills, requiredSkills, preferredSkills) {
            const hasSkill = (name) => candidateSkills.some(s => s.name.toLowerCase() === name.toLowerCase());
            const isVerified = (name) => candidateSkills.some(s => s.name.toLowerCase() === name.toLowerCase() && s.verified);

            const reqMatched = requiredSkills.filter(hasSkill).length;
            const prefMatched = preferredSkills.filter(hasSkill).length;

            const matchedSkillsList = [...requiredSkills, ...preferredSkills].filter(hasSkill);
            const verifiedMatched = matchedSkillsList.filter(isVerified).length;

            const reqPart = requiredSkills.length > 0 ? 70 * (reqMatched / requiredSkills.length) : 0;
            const prefPart = preferredSkills.length > 0 ? 20 * (prefMatched / preferredSkills.length) : 0;
            const evPart = matchedSkillsList.length > 0 ? 10 * (verifiedMatched / matchedSkillsList.length) : 0;

            const totalScore = Math.round(reqPart + prefPart + evPart);
            const verifiedShare = matchedSkillsList.length > 0 ? (verifiedMatched / matchedSkillsList.length) : 0;
            const confidence = verifiedShare >= 0.75 ? 'High' : verifiedShare >= 0.50 ? 'Medium' : 'Low';

            return {
                score: totalScore,
                reqMatched,
                reqTotal: requiredSkills.length,
                prefMatched,
                prefTotal: preferredSkills.length,
                verifiedMatched,
                totalMatched: matchedSkillsList.length,
                confidence,
                verifiedShare: Math.round(verifiedShare * 100)
            };
        }

        function calculateAlignmentScore(demandList, coverageMap) {
            let sumDemand = 0;
            let sumWeighted = 0;
            demandList.forEach(item => {
                const cov = coverageMap[item.id] !== undefined ? coverageMap[item.id] : 0;
                sumDemand += item.index;
                sumWeighted += (item.index * cov);
            });
            if (sumDemand === 0) return 0;
            return Math.round(sumWeighted / sumDemand);
        }

            const [selectedPositionId, setSelectedPositionId] = useState(positions[0] ? positions[0].id : 'P1');
            const activePosition = positions.find(p => p.id === selectedPositionId) || positions[0];

            const [showPostModal, setShowPostModal] = useState(false);
            const [newPositionForm, setNewPositionForm] = useState({
                role: '', type: 'Internship', desc: '', required: '', preferred: '', location: 'Bengaluru', mode: 'Hybrid', terms: '6 months, ₹30,000 / month'
            });

            const [shortlistedMap, setShortlistedMap] = useState({});
            const [feedbackMap, setFeedbackMap] = useState({});
            const [feedbackModal, setFeedbackModal] = useState({ isOpen: false, candidate: null, note: '' });
            const [inspectedCandidate, setInspectedCandidate] = useState(candidates[0] || null);

            if (!isAuthenticated) {
                return (
                    <div className="bg-surface border border-line rounded-md p-8 text-center max-w-md mx-auto my-12 shadow-sb-sm">
                        <div className="w-10 h-10 rounded-full bg-teal-50 text-teal flex items-center justify-center mx-auto mb-3">
                            <Icons.Building />
                        </div>
                        <h2 className="text-base font-semibold text-navy mb-1">Industry Portal Authentication Required</h2>
                        <p className="text-xs text-ink-muted mb-4">
                            Access to company requirement management and candidate inspections is restricted to verified industry accounts.
                        </p>
                        <Button variant="primary" size="md" onClick={() => onPromptLogin('industry')}>
                            Login with Company Credentials
                        </Button>
                    </div>
                );
            }

            const companyName = session.orgId === 'c_kestrel' ? 'Kestrel Retail Tech' : 'Orbis Analytics';

            const handleCreatePosition = (e) => {
                e.preventDefault();
                if (!newPositionForm.role || !newPositionForm.required) {
                    onToast("Please complete required role and skill fields.");
                    return;
                }
                const newPos = {
                    id: `P_${Date.now()}`,
                    companyId: session.orgId,
                    company: companyName,
                    role: newPositionForm.role,
                    type: newPositionForm.type,
                    location: newPositionForm.location,
                    mode: newPositionForm.mode,
                    terms: newPositionForm.terms,
                    stipendSalary: newPositionForm.terms,
                    duration: 'Flexible',
                    required: newPositionForm.required.split(',').map(s => s.trim()).filter(Boolean),
                    preferred: newPositionForm.preferred.split(',').map(s => s.trim()).filter(Boolean),
                    desc: newPositionForm.desc || 'New corporate position requirements.',
                    whyMatchTemplate: 'Position requirements recorded.'
                };
                positions.push(newPos);
                setSelectedPositionId(newPos.id);
                setShowPostModal(false);
                onToast(`Position "${newPositionForm.role}" published.`);
            };

            const evaluatedCandidates = useMemo(() => {
                if (!activePosition) return [];
                return candidates.map(cand => {

                    );
                    const missingSkills = activePosition.required.filter(req => 
                        !cand.studentSkills.some(cs => cs.name.toLowerCase() === req.toLowerCase())
                    );
                    return {
                        ...cand,
                        matchScore: mathResult.score,
                        mathResult,
                        matchedSkills,
                        missingSkills
                    };
                }).sort((a, b) => b.matchScore - a.matchScore);
            }, [candidates, activePosition]);

        function UniversitySection({ session, demand, coverage, benchmark, onRefreshDemand, isRefreshed, alignmentScore, onPromptLogin }) {
            const isAuthenticated = session.role === 'university';
            const [demandTab, setDemandTab] = useState('most_demanded');
            const [expandedBenchmark, setExpandedBenchmark] = useState(true);

            if (!isAuthenticated) {
                return (
                    <div className="bg-surface border border-line rounded-md p-8 text-center max-w-md mx-auto my-12 shadow-sb-sm">
                        <div className="w-10 h-10 rounded-full bg-brand-50 text-brand flex items-center justify-center mx-auto mb-3">
                            <Icons.GraduationCap />
                        </div>

                        <p className="text-xs text-ink-muted mb-4">
                            Access to institutional curriculum gap analytics and private benchmarking is restricted to accredited university administrators.
                        </p>
                        <Button variant="primary" size="md" onClick={() => onPromptLogin('university')}>
                            Login with Institutional Credentials
                        </Button>
                    </div>
                );
            }

            const gapAnalysisRows = demand.map(d => {
                const cov = coverage[d.id] !== undefined ? coverage[d.id] : 0;
                const gap = d.index - cov;
                let covLabel = "Moderate";
                if (cov < 30) covLabel = "Very Low";
                else if (cov < 55) covLabel = "Low";
                else if (cov >= 75) covLabel = "High";

                let status = "Aligned";
                let statusType = "aligned";
                if (gap >= 25) {
                    status = "Critical Gap";
                    statusType = "critical";
                } else if (gap >= 10) {
                    status = "Moderate Gap";
                    statusType = "partial";
                }

                let rec = "Curriculum coverage satisfies target employer benchmark.";
                if (d.id === 'docker') rec = "Add a practical containerisation module in the second-year software engineering course.";
                if (d.id === 'cloud') rec = "Add hands-on cloud deployment labs (compute, storage, basic deployment) to the existing systems course.";
                if (d.id === 'genai') rec = "Introduce an elective on prompt-based application development and evaluation.";

                return {
                    id: d.id,
                    name: d.name,
                    category: d.category,
                    demandIndex: d.index,
                    coverage: cov,
                    covLabel,
                    gap,
                    status,
                    statusType,
                    rec
                };
            });

            const deptPlacementData = [
                { dept: "CSE", placement: 92, internship: 85 },
                { dept: "IT", placement: 89, internship: 82 },
                { dept: "ECE", placement: 81, internship: 74 },
                { dept: "Mechanical", placement: 75, internship: 66 },
            ];

            return (
                <div className="fade-in space-y-8">
                    <div className="border-b border-line pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <div className="flex items-center gap-2">
                                <h1 className="text-xl font-semibold text-navy">Your University — Academic Intelligence Portal</h1>
                                <span className="px-2 py-0.5 rounded-sm bg-brand-50 text-brand border border-brand/20 text-xs font-medium">
                                    Accredited Partner
                                </span>
                            </div>
                            <p className="text-xs text-ink-muted mt-0.5">
                                Curriculum-to-industry alignment analysis, demand tracking, and benchmark index.
                            </p>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-xs text-ink-muted">Alignment Score:</span>
                            <span className="text-lg font-bold text-navy px-2.5 py-0.5 bg-slate-100 rounded-sm border border-line">
                                {alignmentScore}%
                            </span>
                        </div>
                    </div>

                    {/* 8.1 CURRENT INDUSTRY SKILL DEMAND */}
                    <section aria-labelledby="demand-table-heading" className="bg-surface border border-line rounded-md p-5 shadow-sb-sm">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4 border-b border-line pb-3">
                            <div>
                                <h2 id="demand-table-heading" className="text-base font-semibold text-navy">
                                    Current Industry Skill Demand
                                </h2>
                                <p className="text-xs text-ink-muted">
                                    Sample demand data · Last updated {new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}
                                </p>
                            </div>
                            <Button 
                                size="sm" 
                                variant="secondary" 
                                onClick={onRefreshDemand} 
                                className="flex items-center gap-1.5"
                            >
                                <Icons.Refresh />
                                <span>{isRefreshed ? "Reset Baseline Demand" : "Refresh Demo Data"}</span>
                            </Button>
                        </div>

                        <p className="text-xs text-ink-muted mb-3 bg-canvas p-2.5 rounded-sm border border-line">
                            Industry demand changes over time; curriculum comparison is re-evaluated when the demand data is updated.
                        </p>

                        <div className="flex border-b border-line mb-4 text-xs font-medium">
                            {[
                                { id: 'most_demanded', label: 'Most Demanded' },
                                { id: 'emerging', label: 'Emerging Skills' },
                                { id: 'by_role', label: 'By Role' },
                                { id: 'by_industry', label: 'By Industry' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setDemandTab(tab.id)}
                                    className={`py-2 px-3 border-b-2 transition ${
                                        demandTab === tab.id ? 'border-brand text-brand font-semibold' : 'border-transparent text-ink-muted hover:text-ink'

            const [selectedRole, setSelectedRole] = useState(roleHint);

            const [loginEmail, setLoginEmail] = useState("");
            const [loginPassword, setLoginPassword] = useState("");

            const [orgName, setOrgName] = useState("");
            const [signupEmail, setSignupEmail] = useState("");
            const [signupPassword, setSignupPassword] = useState("");
            const [college, setCollege] = useState("Your University");
            const [course, setCourse] = useState("B.Tech CSE");
            const [gradYear, setGradYear] = useState("2027");
            const [website, setWebsite] = useState("");
            const [contactPerson, setContactPerson] = useState("");

            const [errors, setErrors] = useState({});
            const [forgotSubmitted, setForgotSubmitted] = useState(false);

            useEffect(() => {
                setMode(initialMode);
                setSelectedRole(roleHint);
                setErrors({});
                setForgotSubmitted(false);
            }, [initialMode, roleHint, isOpen]);

            const handleQuickDemo = (accountType) => {
                if (accountType === 'student') {
                    onLogin({ role: 'student', orgId: 's_meera', name: 'Meera Iyer', email: 'meera.iyer@student.example.edu' });
                } else if (accountType === 'orbis') {
                    onLogin({ role: 'industry', orgId: 'c_orbis', name: 'Orbis Analytics', email: 'hiring@orbis-analytics.example.com' });
                } else if (accountType === 'kestrel') {
                    onLogin({ role: 'industry', orgId: 'c_kestrel', name: 'Kestrel Retail Tech', email: 'hiring@kestrel-retail.example.com' });
                } else if (accountType === 'university') {
                    onLogin({ role: 'university', orgId: 'u_you', name: 'Your University', email: 'industry.cell@youruniversity.example.edu' });
                }
            };

            const validateLogin = () => {
                const errs = {};
                if (!loginEmail.trim()) errs.loginEmail = "Email or Institutional Email is required.";
                else if (!loginEmail.includes('@')) errs.loginEmail = "Enter a valid email address.";
                if (!loginPassword) errs.loginPassword = "Password is required.";
                setErrors(errs);
                return Object.keys(errs).length === 0;
            };

            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                if (!validateLogin()) return;

                if (window.SkillBridgeAPI) {
                    const user = await window.SkillBridgeAPI.login(loginEmail, loginPassword);
                    if (user) {
                        onLogin(user);
                        return;
                    }
                }

                const lowered = loginEmail.toLowerCase();
                let userRole = 'student';
                let orgId = 's_meera';
                let displayName = 'Meera Iyer';

                if (lowered.includes('orbis')) {
                    userRole = 'industry';
                    orgId = 'c_orbis';
                    displayName = 'Orbis Analytics';
                } else if (lowered.includes('kestrel')) {
                    userRole = 'industry';
                    orgId = 'c_kestrel';
                    displayName = 'Kestrel Retail Tech';
                } else if (lowered.includes('university') || lowered.includes('.edu')) {
                    if (lowered.includes('student')) {
                        userRole = 'student';
                        orgId = 's_meera';
                        displayName = 'Meera Iyer';
                    } else {
                        userRole = 'university';
                        orgId = 'u_you';
                        displayName = 'Your University';
                    }
                }

                onLogin({ role: userRole, orgId, name: displayName, email: loginEmail });
            };

            const handleSignupSubmit = (e) => {
                e.preventDefault();
                const errs = {};
                if (!signupEmail.trim() || !signupEmail.includes('@')) errs.signupEmail = "Enter a valid email address.";
                if (!signupPassword || signupPassword.length < 6) errs.signupPassword = "Password must be at least 6 characters.";

                if (selectedRole === 'student') {
                    if (!fullName.trim()) errs.fullName = "Full Name is required.";
                } else {
                    if (!orgName.trim()) errs.orgName = "Organisation Name is required.";
                }

                if (Object.keys(errs).length > 0) {
                    setErrors(errs);
                    return;
                }

                onLogin({
                    role: selectedRole,
                    orgId: selectedRole === 'student' ? `s_${Date.now()}` : selectedRole === 'industry' ? `c_${Date.now()}` : `u_${Date.now()}`,
                    name: selectedRole === 'student' ? fullName : orgName,
                    email: signupEmail
                });
            };

            return (
                <Modal 
                    isOpen={isOpen} 
                    onClose={onClose} 
                    title={mode === 'login' ? 'Account Login' : mode === 'signup' ? 'Create Account' : 'Forgot Password'}
                >
                    <div className="space-y-4 text-xs">
                        {notice && (
                            <div className="p-2.5 bg-brand-50 border border-brand/20 rounded-sm text-navy text-xs">
                                {notice}
                            </div>
                        )}

                        {mode === 'forgot' ? (
                            <div className="space-y-3">
                                {forgotSubmitted ? (
                                    <div className="p-3 bg-ok-bg text-ok border border-ok/20 rounded-sm">
                                        Password reset instructions sent to your email (simulated).
                                        <div className="mt-2">
                                            <Button size="sm" variant="secondary" onClick={() => setMode('login')}>Return to Login</Button>
                                        </div>
                                    </div>
                                ) : (
                                    <form onSubmit={(e) => { e.preventDefault(); setForgotSubmitted(true); }} className="space-y-3">
                                        <Field label="Email Address" id="forgot-email" required>
                                            <input 
                                                id="forgot-email" 
                                                type="email" 
                                                placeholder="your.email@example.com"
                                                className="w-full h-9 px-2.5 bg-canvas border border-line-strong rounded-sm focus:outline-none focus:ring-2 focus:ring-brand"
                                                required 
                                            />
                                        </Field>
                                        <div className="flex justify-end gap-2 pt-2">
                                            <Button type="button" variant="secondary" size="sm" onClick={() => setMode('login')}>Back to Login</Button>
                                            <Button type="submit" variant="primary" size="sm">Send Reset Link</Button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        ) : mode === 'login' ? (
                            <form onSubmit={handleLoginSubmit} className="space-y-3">
                                <Field label="Email or Institutional Email" id="login-email" required error={errors.loginEmail}>
                                    <input 
                                        id="login-email" 
                                        type="email" 
                                        placeholder="e.g. meera.iyer@student.example.edu"
                                        value={loginEmail}
                                        onChange={(e) => setLoginEmail(e.target.value)}
                                        className="w-full h-9 px-2.5 bg-canvas border border-line-strong rounded-sm focus:outline-none focus:ring-2 focus:ring-brand"
                                        required 
                                    />
                                </Field>

                                <Field label="Password" id="login-pwd" required error={errors.loginPassword}>
                                    <input 
                                        id="login-pwd" 
                                        type="password" 
                                        placeholder="••••••••"
                                        value={loginPassword}
                                        onChange={(e) => setLoginPassword(e.target.value)}
                                        className="w-full h-9 px-2.5 bg-canvas border border-line-strong rounded-sm focus:outline-none focus:ring-2 focus:ring-brand"
                                        required 
                                    />
                                </Field>

                                <div className="flex justify-between items-center text-[11px] pt-1">
                                    <button type="button" onClick={() => setMode('forgot')} className="text-brand hover:underline">
                                        Forgot Password?
                                    </button>
                                    <button type="button" onClick={() => setMode('signup')} className="text-navy font-semibold hover:underline">
                                        Don't have an account? Sign up
                                    </button>
                                </div>

                                <Button type="submit" variant="primary" size="md" className="w-full mt-2">
                                    Login
                                </Button>

                                <div className="pt-3 border-t border-line text-center">
                                    <span className="text-[11px] text-ink-muted block mb-2 font-medium">Or log in instantly with demo credentials (password: Demo@1234):</span>
                                    <div className="grid grid-cols-2 gap-1.5 text-[11px]">
                                        <button 
                                            type="button" 
                                            onClick={() => handleQuickDemo('student')}
                                            className="p-1.5 bg-slate-100 hover:bg-slate-200 text-navy font-semibold rounded-sm border border-line text-left truncate"
                                        >
                                            🎓 Student (Meera)
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={() => handleQuickDemo('university')}
                                            className="p-1.5 bg-slate-100 hover:bg-slate-200 text-navy font-semibold rounded-sm border border-line text-left truncate"
                                        >
                                            🏛️ University (Your Univ)
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={() => handleQuickDemo('orbis')}
                                            className="p-1.5 bg-slate-100 hover:bg-slate-200 text-navy font-semibold rounded-sm border border-line text-left truncate"
                                        >
                                            🏢 Industry (Orbis Analytics)
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={() => handleQuickDemo('kestrel')}
                                            className="p-1.5 bg-slate-100 hover:bg-slate-200 text-navy font-semibold rounded-sm border border-line text-left truncate"
                                        >
                                            🏢 Industry (Kestrel Retail)
                                        </button>
                                    </div>
                                </div>
                            </form>
                        ) : (
                            <form onSubmit={handleSignupSubmit} className="space-y-3">
                                <div>
                                    <label className="block text-xs font-semibold text-ink mb-1">Select Account Type</label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {[
                                            { id: 'student', label: 'Student' },
                                            { id: 'industry', label: 'Industry' },
                                            { id: 'university', label: 'University' }
                                        ].map(r => (
                                            <button
                                                key={r.id}
                                                type="button"
                                                onClick={() => setSelectedRole(r.id)}
                                                className={`py-1.5 text-xs font-medium rounded-sm border transition ${
                                                    selectedRole === r.id ? 'bg-navy text-white border-navy font-semibold' : 'bg-canvas text-ink-muted border-line hover:text-ink'
                                                }`}
                                            >
                                                {r.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {selectedRole === 'student' ? (
                                    <>
                                        <Field label="Full Name" id="reg-name" required error={errors.fullName}>
                                            <input id="reg-name" type="text" placeholder="e.g. Meera Iyer" value={fullName} onChange={e => setFullName(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" required />
                                        </Field>
                                        <Field label="University / College" id="reg-univ">
                                            <input id="reg-univ" type="text" value={college} onChange={e => setCollege(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" />
                                        </Field>
                                        <div className="grid grid-cols-2 gap-2">
                                            <Field label="Course / Branch" id="reg-course">
                                                <input id="reg-course" type="text" value={course} onChange={e => setCourse(e.target.value)} className="w-full h-8 px-2 bg-canvas border border-line-strong rounded-sm text-xs" />
                                            </Field>
                                            <Field label="Graduation Year" id="reg-year">
                                                <input id="reg-year" type="number" value={gradYear} onChange={e => setGradYear(e.target.value)} className="w-full h-8 px-2 bg-canvas border border-line-strong rounded-sm text-xs" />
                                            </Field>
                                        </div>
                                    </>
                                ) : selectedRole === 'university' ? (
                                    <>
                                        <Field label="University Name" id="reg-uname" required error={errors.orgName}>
                                            <input id="reg-uname" type="text" placeholder="e.g. Your University" value={orgName} onChange={e => setOrgName(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" required />
                                        </Field>
                                        <Field label="Contact Person / Department Head" id="reg-ucontact">
                                            <input id="reg-ucontact" type="text" placeholder="Dr. A. Sharma" value={contactPerson} onChange={e => setContactPerson(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" />
                                        </Field>
                                        <Field label="Institutional Website" id="reg-uweb">
                                            <input id="reg-uweb" type="url" placeholder="https://university.example.edu" value={website} onChange={e => setWebsite(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" />
                                        </Field>
                                    </>
                                ) : (
                                    <>
                                        <Field label="Company Name" id="reg-cname" required error={errors.orgName}>
                                            <input id="reg-cname" type="text" placeholder="e.g. Orbis Analytics" value={orgName} onChange={e => setOrgName(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" required />
                                        </Field>
                                        <Field label="Contact Person / Recruiter" id="reg-ccontact">
                                            <input id="reg-ccontact" type="text" placeholder="Talent Acquisition Lead" value={contactPerson} onChange={e => setContactPerson(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" />
                                        </Field>
                                        <Field label="Company Website" id="reg-cweb">
                                            <input id="reg-cweb" type="url" placeholder="https://company.example.com" value={website} onChange={e => setWebsite(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" />
                                        </Field>
                                    </>
                                )}

                                <Field label={selectedRole === 'university' ? "Official Institutional Email" : "Email Address"} id="reg-email" required error={errors.signupEmail}>
                                    <input id="reg-email" type="email" placeholder="name@domain.com" value={signupEmail} onChange={e => setSignupEmail(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" required />
                                </Field>

                                <Field label="Password" id="reg-pwd" required error={errors.signupPassword} hint="At least 6 characters">
                                    <input id="reg-pwd" type="password" placeholder="••••••••" value={signupPassword} onChange={e => setSignupPassword(e.target.value)} className="w-full h-8 px-2.5 bg-canvas border border-line-strong rounded-sm text-xs" required />
                                </Field>

                                <div className="flex justify-between items-center text-[11px] pt-1">
                                    <button type="button" onClick={() => setMode('login')} className="text-brand hover:underline">
                                        Already have an account? Login
                                    </button>
                                </div>

                                <Button type="submit" variant="primary" size="md" className="w-full mt-2">
                                    Create {selectedRole} Account
                                </Button>
                            </form>
                        )}
                    </div>
                </Modal>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
