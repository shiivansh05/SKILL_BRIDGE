            const roles = ["Software Engineer","Data Analyst","Data Scientist","Machine Learning Engineer","AI Engineer","Backend Developer","Frontend Developer","Cloud Engineer","DevOps Engineer","Product Analyst"];

            const getWorkMode = (opp) => {
                if (opp.location.toLowerCase().includes("hybrid")) return "Hybrid";
                if (opp.location.toLowerCase().includes("remote")) return "Remote";
                if (opp.location.toLowerCase().includes("on-site")) return "On-site";
                return "On-site";

            const getCities = (opp) => cities.filter(city => opp.location.toLowerCase().includes(city.toLowerCase()));

            const filteredCities = cities.filter(city =>
                city.toLowerCase().includes(cityQuery.trim().toLowerCase()) && !locationFilter.includes(city)

                role.toLowerCase().includes(roleQuery.trim().toLowerCase())

                const q = searchQuery.trim().toLowerCase();
                return [...opportunities].filter(o => {
                    const haystack = `${o.company} ${o.title} ${o.location} ${o.marketSkills}`.toLowerCase();
                    const matchesSearch = !q || haystack.includes(q);
                    const matchesType = typeFilter === "All" || o.type === typeFilter;
                    const matchesLocation = locationFilter.length === 0 || locationFilter.some(city => getCities(o).includes(city));
                    const matchesMode = workModeFilter.length === 0 || workModeFilter.includes(getWorkMode(o));
                    const normalizedRole = desiredRole.toLowerCase().replace(" engineer","").replace(" analyst","").replace(" scientist","");
                    const matchesRole = !desiredRole || `${o.title} ${o.marketSkills}`.toLowerCase().includes(normalizedRole);
                    const avg = parseFloat(o.avgPackage.replace(/[^0-9.]/g, "")) || 0;
                    return matchesSearch && matchesType && matchesLocation && matchesMode && matchesRole && avg >= minPackage;
